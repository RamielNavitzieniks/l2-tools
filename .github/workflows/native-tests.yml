name: native-tests

on:
  pull_request:
    paths: ["native/**", ".github/workflows/native-tests.yml"]
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Nucleo sem dependencias externas
        run: python -m unittest discover -s tests -t . -v
      - name: Bibliotecas de sistema do Qt e Tesseract OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 tesseract-ocr
      - name: Instalar extras de visao e GUI
        run: python -m pip install numpy opencv-python-headless PySide6-Essentials pytesseract mss
      - name: Suite completa (visao e OCR com imagens sinteticas, GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
