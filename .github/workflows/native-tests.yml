name: native-tests

on:
  pull_request:
    paths: ["native/**", ".github/workflows/native-tests.yml"]
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Nucleo sem dependencias externas
        run: python -m unittest discover -s tests -t . -v
      - name: Instalar extra de visao
        run: python -m pip install numpy opencv-python-headless
      - name: Suite completa (inclui visao com imagens sinteticas)
        run: python -m unittest discover -s tests -t . -v
